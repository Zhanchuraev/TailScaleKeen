name: Test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tailscalekeen-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: sh -n install.sh && sh -n scripts/S98tailscale-panel
      - run: python3 scripts/check_public.py
      - run: python3 scripts/build_release.py
  publish:
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release tag and build
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          python3 scripts/check_public.py
          python3 scripts/build_release.py
      - name: Upload verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            existing="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
            directory="$(mktemp -d)"
            trap 'rm -rf "$directory"' EXIT
            for file in tailscalekeen.tar.gz tailscalekeen.tar.gz.sha256; do
              if printf '%s\n' "$existing" | grep -Fxq "$file"; then
                gh release download "$RELEASE_TAG" --pattern "$file" --dir "$directory"
                cmp "dist/$file" "$directory/$file"
              else
                gh release upload "$RELEASE_TAG" "dist/$file"
              fi
            done
          else
            gh release create "$RELEASE_TAG" dist/tailscalekeen.tar.gz dist/tailscalekeen.tar.gz.sha256 --title "TailScaleKeen $RELEASE_TAG" --notes-file CHANGELOG.md
          fi
